name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Warn if there is no entry point
        run: |
          if [ ! -f index.html ]; then
            echo "::warning::No index.html at the repository root - the published site will 404 until you create one."
          fi

      # No build step: the repository root IS the website.
      # .nojekyll stops GitHub from running Jekyll, which would hide files
      # and folders whose names start with an underscore.
      - name: Disable Jekyll processing
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
